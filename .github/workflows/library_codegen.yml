# This workflow regenerates code using smithy-dafny and checks that the output matches what's checked in.
#
# It regenerates starting from TestVectorsAwsCryptographicMaterialProviders only, rather
# than looping over every library. TestVectorsAwsCryptographicMaterialProviders's
# dependency closure (PROJECT_DEPENDENCIES + STD_LIBRARY in its Makefile) already covers
# every other library here, because polymorph_dafny/polymorph_java/etc. each recurse
# into their dependencies via _polymorph_dependencies
# (smithy-dafny/SmithyDafnyMakefile.mk) and write into that dependency's own directory.
# Looping the matrix over all six libraries used to regenerate StandardLibrary's code up
# to 6 times and each leaf library's code up to 3 times per run, all but one of which was
# never even diffed (check_polymorph_diff only ever diffed the single matrix entry's own
# directory) - pure wasted Smithy-Dafny codegen-cli invocations. Regenerating once and
# diffing every library's directory afterward gets the same coverage for a fraction of
# the compute.
name: Library Code Generation
on:
  workflow_call:
    inputs:
      dafny:
        description: "The Dafny version to run"
        required: true
        type: string

permissions:
  contents: read

jobs:
  code-generation:
    strategy:
      fail-fast: false
      matrix:
        # Note dotnet is only used for formatting generated code
        # in this workflow
        dotnet-version: ["6.0.x"]
        # Note python is only used for formatting generated code
        # in this workflow.
        # The workflow installs black and docformatter and runs them on generated code.
        python-version: [3.11]
        go-version: [1.24]
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Support longpaths
        run: |
          git config --global core.longpaths true

      - uses: actions/checkout@v6
      # The specification submodule is private so we don't have access, but we don't need
      # it to verify the Dafny code. Instead we manually pull the submodules we DO need.
      - run: git submodule update --init libraries
      - run: git submodule update --init --recursive smithy-dafny

      # Only used to format generated code
      # and to translate version strings such as "nightly-latest"
      # to an actual DAFNY_VERSION.
      - name: Setup Dafny
        uses: ./.github/actions/setup_dafny
        with:
          dafny-version: ${{ inputs.dafny }}

      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Install Go imports
        shell: bash
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.36.0

      # even though we just installed dotnet 6, maybe dotnet 8 is out there somewhere
      - name: Create temporary global.json
        run: echo '{"sdk":{"rollForward":"latestFeature","version":"6.0.0"}}' > ./global.json

      - uses: ./.github/actions/polymorph_codegen
        with:
          dafny: ${{ env.DAFNY_VERSION }}
          library: TestVectorsAwsCryptographicMaterialProviders
          diff-generated-code: false

      - name: Check regenerated code against committed code
        run: |
          dirty=()
          for lib in \
            StandardLibrary \
            AwsCryptographyPrimitives \
            ComAmazonawsKms \
            ComAmazonawsDynamodb \
            AwsCryptographicMaterialProviders \
            TestVectorsAwsCryptographicMaterialProviders; do
            echo "::group::Checking $lib"
            if ! git diff --exit-code -- "$lib"; then
              echo "ERROR: $lib has polymorph-generated code that does not match the committed code - see diff above."
              dirty+=("$lib")
            fi
            echo "::endgroup::"
          done
          if [ "${#dirty[@]}" -ne 0 ]; then
            echo "The following libraries have out-of-date generated code: ${dirty[*]}"
            echo "Either commit the changes or regenerate with 'POLYMORPH_OPTIONS=--update-patch-files'."
            exit 1
          fi
