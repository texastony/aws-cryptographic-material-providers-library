#
# This local action sets up code dependencies
# to run Smithy-Dafny CI in GitHub Actions workflows.
#

name: "Install Smithy-Dafny codegen dependencies"
description: "Install Java package dependencies required to run Smithy-Dafny codegen"
inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  mpl-submodule-path:
    description: "Path to MPL submodule if used from upstream repo"
    required: false
    default: "./"
runs:
  using: "composite"
  steps:
    - name: Setup Java 17 for codegen
      uses: Wandalen/wretry.action@v3
      with:
        action: actions/setup-java@v5
        with: |
          distribution: "corretto"
          java-version: "17"
          cache: "gradle"
        attempt_limit: 3
        attempt_delay: 30000

    - name: Cache Maven local repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        # Hash-keyed on smithy-dafny's own build files (not a static key) so the cache
        # actually invalidates when its dependency set changes, e.g. a submodule bump,
        # rather than silently serving a stale ~/.m2 forever. restore-keys still gives a
        # fast partial-hit fallback while the exact-match entry warms up.
        key: ${{ runner.os }}-maven-smithy-dafny-${{ hashFiles(format('{0}smithy-dafny/**/*.gradle*', inputs.mpl-submodule-path), format('{0}smithy-dafny/**/gradle-wrapper.properties', inputs.mpl-submodule-path)) }}
        restore-keys: |
          ${{ runner.os }}-maven-smithy-dafny-
          ${{ runner.os }}-maven-

    - name: Install smithy-dafny-codegen dependencies locally
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 8
        retry_wait_seconds: 30
        max_attempts: 3
        shell: bash
        command: make -C ${{ inputs.mpl-submodule-path }}smithy-dafny mvn_local_deploy_polymorph_dependencies

    - name: Setup Python
      uses: Wandalen/wretry.action@v3
      with:
        action: actions/setup-python@v6
        with: |
          python-version: ${{ inputs.python-version || matrix.python-version }}
          architecture: x64
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
        attempt_limit: 3
        attempt_delay: 30000
    - uses: nick-fields/retry@v3
      with:
        timeout_minutes: 5
        retry_wait_seconds: 30
        max_attempts: 3
        shell: bash
        command: |
          python -m pip install pip
          python -m pip install black==25.1
          python -m pip install docformatter==1.7.7
          python -m pip install tox

    - name: Install Go
      uses: Wandalen/wretry.action@v3
      with:
        action: actions/setup-go@v6
        with: |
          go-version: "1.24"
          # There's no go.mod at repo root, but every library has its own
          # runtimes/go/*/go.sum, so an explicit cache-dependency-path glob finds
          # them without needing a root-level module.
          cache: true
          cache-dependency-path: "**/go.sum"
        attempt_limit: 3
        attempt_delay: 30000

    - name: Install Go imports
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 8
        retry_wait_seconds: 30
        max_attempts: 3
        shell: bash
        command: go install golang.org/x/tools/cmd/goimports@v0.36.0

    # Without this the if-dafny-at-least command includes "Downloading ..." output
    - name: Arbitrary makefile target to force downloading Gradle
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 8
        retry_wait_seconds: 30
        max_attempts: 3
        shell: bash
        command: make -C ${{ inputs.mpl-submodule-path }}StandardLibrary setup_net
